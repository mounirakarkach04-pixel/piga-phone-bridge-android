<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12384b"><title>Kalnbach Operations</title><style>
:root{--nav:#102f3f;--nav2:#173f54;--accent:#287292;--bg:#f3f6f7;--card:#fff;--ink:#17252d;--muted:#71808a;--line:#dbe4e8;--ok:#187659;--warn:#a66512;--bad:#a53a3a;--soft:#edf3f5}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}textarea{min-height:85px}.btn{border:0;background:var(--accent);color:#fff;padding:11px 13px;border-radius:10px;font-weight:800}.btn.alt{background:#fff;color:#244553;border:1px solid var(--line)}.btn.green{background:var(--ok)}.btn.danger{background:#9f3d3d}.btn.sm{padding:7px 9px;font-size:12px}.top{height:58px;background:var(--nav);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;position:sticky;top:0;z-index:50}.burger{width:42px;height:42px;border:0;border-radius:10px;background:#204c60;color:#fff;font-size:24px}.brand{font-weight:900;flex:1}.side{position:fixed;left:-292px;top:0;bottom:0;width:292px;background:#0d2b39;color:#fff;z-index:100;padding:18px 12px;overflow:auto;transition:.2s}.side.open{left:0}.scrim{display:none;position:fixed;inset:0;background:#0008;z-index:90}.scrim.open{display:block}.navbtn{display:block;width:100%;text-align:left;border:0;background:transparent;color:#d6e5eb;padding:12px;border-radius:10px;margin:2px 0}.navbtn.on{background:#23576d;color:#fff}.content{max-width:1180px;margin:auto;padding:14px 12px 88px}.hero{background:linear-gradient(135deg,#12384b,#22617c);color:#fff;padding:22px;border-radius:18px;margin:6px 0 14px}.hero h1{font-size:29px;line-height:1.05;margin:7px 0}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 4px 16px rgba(20,50,65,.05)}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}.kpi{font-size:31px;font-weight:900}.muted{color:var(--muted)}.pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:var(--soft);font-size:11px;font-weight:800}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.actions{display:flex;gap:8px;flex-wrap:wrap}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0}.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:580px}.table th,.table td{padding:9px 7px;border-bottom:1px solid #e5ecef;text-align:left;vertical-align:top}.table th{font-size:11px;text-transform:uppercase;color:var(--muted)}.login{max-width:560px;margin:4vh auto;padding:14px}.tabs{display:flex;background:#e8eff2;border-radius:11px;padding:4px;margin-bottom:14px}.tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:8px;font-weight:800}.tabs button.on{background:#fff}.notice{padding:12px;border-radius:10px;background:#fff8e9;border:1px solid #eed59a}.error{padding:12px;border-radius:10px;background:#fff0f0;border:1px solid #e9b8b8;color:#7e2525}.success{padding:12px;border-radius:10px;background:#edf9f4;border:1px solid #b8dfd0;color:#145c46}.formgroup{margin:9px 0}.formgroup label{display:block;font-size:12px;font-weight:800;margin-bottom:4px}.bottom{display:flex;position:fixed;left:8px;right:8px;bottom:8px;background:rgba(16,47,63,.97);border-radius:14px;padding:6px;z-index:40;box-shadow:0 10px 35px rgba(10,32,43,.3)}.bottom button{flex:1;border:0;background:transparent;color:#cfe1e8;padding:9px 5px;border-radius:9px;font-size:11px}.bottom button.on{background:#285b72;color:#fff}.right{margin-left:auto}.check{display:flex;gap:8px;align-items:flex-start}.check input{width:auto;margin-top:4px}.sig{height:150px;width:100%;background:#fff;border:1px dashed #9cb0ba;border-radius:10px;touch-action:none}.legal h3{margin-bottom:4px}.spacer{height:6px}@media(max-width:800px){.c3,.c4,.c6,.c8{grid-column:span 12}.row,.row3{grid-template-columns:1fr}.content{padding-bottom:90px}.hero h1{font-size:26px}}@media(min-width:1000px){.side{left:0}.scrim,.burger{display:none!important}.appmain{margin-left:292px}.bottom{display:none}.content{padding-bottom:28px}}
</style></head><body><div id="app"></div><script>
(()=>{'use strict';
const APP=document.getElementById('app');
const BASE='https://qjvopzschqukitvudgfz.supabase.co';
const KEY='sb_publishable_fDsruYO5WHEqKVRjNEl9Rg_dYpSMrYg';
const TENANTS=[{id:'d9cb851a-3c9b-45df-969e-f8cac3b10667',name:'Robert Kalnbach'},{id:'2ace4a2e-6531-4608-ad76-0848e109c5c7',name:'Jürgen Kalnbach'}];
const SK='kalnbach_session_v3';let session=null,profile=null,view='dashboard',drawer=false,authMode='login',data={};
try{session=JSON.parse(localStorage.getItem(SK)||'null')}catch(_){session=null}
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=d=>d?new Date(d).toLocaleString('de-DE'):'—'; const dateOnly=d=>d?new Date(d).toLocaleDateString('de-DE'):'—';
function flash(msg,type='success'){const n=document.getElementById('flash');if(n){n.className=type;n.textContent=msg;setTimeout(()=>{if(n)n.textContent=''},5000)}else alert(msg)}
async function refreshIfNeeded(){if(!session?.refresh_token)return; if(session.expires_at&&Date.now()/1000<session.expires_at-60)return; const r=await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok){logout();throw new Error('Sitzung abgelaufen')}const j=await r.json();saveSession(j)}
function saveSession(s){session=s;if(s?.expires_in&&!s.expires_at)s.expires_at=Math.floor(Date.now()/1000)+s.expires_in;localStorage.setItem(SK,JSON.stringify(session))}
async function api(path,opt={}){await refreshIfNeeded();const h={apikey:KEY,'Content-Type':'application/json',...(opt.headers||{})};if(session?.access_token)h.Authorization='Bearer '+session.access_token;const r=await fetch(BASE+path,{...opt,headers:h});const tx=await r.text();let j=null;try{j=tx?JSON.parse(tx):null}catch(_){j=tx}if(!r.ok)throw new Error(j?.message||j?.msg||j?.error_description||j?.error||('HTTP '+r.status));return j}
async function table(name,q=''){return api('/rest/v1/'+name+(q?'?'+q:''),{headers:{Accept:'application/json'}})}
async function rpc(name,args={}){return api('/rest/v1/rpc/'+name,{method:'POST',body:JSON.stringify(args)})}
async function signIn(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'Login fehlgeschlagen');saveSession(j);await boot()}
async function signUp(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,name=document.getElementById('fullName').value.trim(),tenant=document.getElementById('tenant').value;if(!document.getElementById('privacyOk').checked||!document.getElementById('termsOk').checked)throw new Error('Datenschutz und Nutzungsbedingungen müssen bestätigt werden.');if(password.length<10)throw new Error('Passwort muss mindestens 10 Zeichen haben.');const r=await fetch(BASE+'/auth/v1/signup',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password,data:{full_name:name,tenant_id:tenant,privacy_version:'2026-09-02-v1',terms_version:'2026-09-02-v1',privacy_accepted:'true',terms_accepted:'true'}})});const j=await r.json();if(!r.ok)throw new Error(j.msg||j.error_description||'Registrierung fehlgeschlagen');if(j.access_token){saveSession(j);await boot()}else{flash('Registrierung erstellt. Bitte E-Mail bestätigen und danach normal einloggen.');authMode='login';renderAuth()}}
function logout(){session=null;profile=null;data={};localStorage.removeItem(SK);renderAuth()}
async function loadProfile(){const uid=session?.user?.id;if(!uid)throw new Error('Benutzer fehlt');const rows=await table('kalnbach_profiles','select=*&user_id=eq.'+encodeURIComponent(uid));profile=rows?.[0]||null}
async function boot(){try{await loadProfile();if(!profile){throw new Error('Profil wird noch eingerichtet. Bitte erneut anmelden.')}if(profile.approval_status!=='approved'){renderPending();return}view='dashboard';await loadData();renderApp()}catch(e){renderAuth(String(e.message||e))}}
async function loadData(){if(!profile)return;const mg=profile.role==='management';const qs='select=*';const jobs=[['assignments','kalnbach_assignments'],['time','kalnbach_time_entries'],['absences','kalnbach_absences'],['workslips','kalnbach_workslips'],['tasks','kalnbach_tasks'],['notifications','kalnbach_notifications']];if(mg)jobs.push(['profiles','kalnbach_profiles'],['customers','kalnbach_customers'],['objects','kalnbach_objects'],['invoices','kalnbach_invoices'],['company','kalnbach_company_settings'],['integrations','kalnbach_integrations'],['compliance','kalnbach_compliance_gate'],['audit','kalnbach_audit_log'],['permissions','kalnbach_permission_catalog'],['userPermissions','kalnbach_user_permissions']);const out=await Promise.all(jobs.map(async([k,t])=>{try{return[k,await table(t,qs)]}catch(e){return[k,[]]}}));data=Object.fromEntries(out)}
function renderAuth(err=''){const sign=authMode==='signup';APP.innerHTML='<div class="login"><div class="hero"><span class="pill">KALNBACH OPERATIONS</span><h1>Ein Login für alle</h1><p>Geschäftsführung und Mitarbeiter melden sich mit E-Mail und Passwort an. Die Rolle wird automatisch serverseitig erkannt.</p></div><div id="flash" class="'+(err?'error':'')+'">'+esc(err)+'</div><div class="tabs"><button class="'+(!sign?'on':'')+'" onclick="K.mode(\'login\')">Anmelden</button><button class="'+(sign?'on':'')+'" onclick="K.mode(\'signup\')">Registrieren</button></div><div class="card">'+(sign?'<div class="formgroup"><label>Name</label><input id="fullName" autocomplete="name"></div><div class="formgroup"><label>Unternehmen / Mandant</label><select id="tenant">'+TENANTS.map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join('')+'</select></div>':'')+'<div class="formgroup"><label>E-Mail</label><input id="email" type="email" autocomplete="email"></div><div class="formgroup"><label>Passwort</label><input id="password" type="password" autocomplete="'+(sign?'new-password':'current-password')+'"></div>'+(sign?'<div class="check"><input id="privacyOk" type="checkbox"><label for="privacyOk">Ich habe die Datenschutzhinweise gelesen und akzeptiere die Verarbeitung meiner Daten zur Kontoführung.</label></div><div class="check"><input id="termsOk" type="checkbox"><label for="termsOk">Ich akzeptiere die Nutzungsbedingungen.</label></div><p class="muted">Neue Mitarbeiterkonten bleiben bis zur Freigabe durch die Geschäftsführung gesperrt.</p>':'')+'<button class="btn green" style="width:100%;margin-top:12px" onclick="K.auth()">'+(sign?'Konto erstellen':'Anmelden')+'</button></div><div class="actions" style="justify-content:center;margin-top:12px"><button class="btn alt sm" onclick="K.showPublicLegal(\'privacy\')">Datenschutz</button><button class="btn alt sm" onclick="K.showPublicLegal(\'terms\')">Nutzungsbedingungen</button><button class="btn alt sm" onclick="K.showPublicLegal(\'imprint\')">Impressum</button></div></div>'}
function renderPending(){APP.innerHTML='<div class="login"><div class="hero"><span class="pill">KONTO ERSTELLT</span><h1>Freigabe ausstehend</h1><p>'+esc(profile.email)+'</p></div><div id="flash"></div><div class="card"><p>Dein Konto ist registriert. Ein Geschäftsführer des gewählten Mandanten muss es unter <b>Benutzer & Rechte</b> freischalten.</p><button class="btn alt" onclick="K.reloadProfile()">Status erneut prüfen</button><button class="btn alt" onclick="K.logout()">Abmelden</button><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><details><summary><b>Erste Geschäftsführung des Mandanten einrichten</b></summary><p class="muted">Nur für die einmalige Ersteinrichtung. Der Einrichtungscode wird nicht in der App gespeichert.</p><input id="bootstrapCode" placeholder="Einrichtungscode"><button class="btn" style="margin-top:8px" onclick="K.bootstrap()">Als erste Geschäftsführung einrichten</button></details></div></div>'}
const managementItems=[['dashboard','Übersicht'],['planning','Einsatzplanung'],['people','Personal'],['customers','Kunden & Objekte'],['time','Zeiten & Export'],['absences','Urlaub & Krank'],['workslips','Arbeitsscheine'],['tasks','Aufgaben'],['invoices','Rechnungen'],['users','Benutzer & Rechte'],['admin','Administration & Recht'],['integrations','Schnittstellen'],['compliance','Compliance'],['legal','Rechtstexte']];
const employeeItems=[['dashboard','Heute'],['planning','Meine Einsätze'],['time','Zeiterfassung'],['absences','Urlaub & Krank'],['workslips','Arbeitsscheine'],['tasks','Aufgaben'],['legal','Datenschutz & Recht']];
function items(){return profile?.role==='management'?managementItems:employeeItems}
function shell(body){const its=items();APP.innerHTML='<div class="side '+(drawer?'open':'')+'" id="side"><h2 style="margin:4px 10px 16px">Kalnbach<br><small style="font-size:11px;color:#9db9c4">OPERATIONS · FIELDTEST</small></h2>'+its.map(x=>'<button class="navbtn '+(view===x[0]?'on':'')+'" onclick="K.go(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'<hr style="border:0;border-top:1px solid #315260"><button class="navbtn" onclick="K.logout()">Abmelden</button></div><div class="scrim '+(drawer?'open':'')+'" onclick="K.toggleMenu()"></div><div class="appmain"><div class="top"><button class="burger" onclick="K.toggleMenu()">☰</button><div class="brand">Kalnbach Operations</div><span class="pill">'+(profile.role==='management'?'Geschäftsführung':'Mitarbeiter')+'</span></div><main class="content"><div id="flash"></div>'+body+'</main><div class="bottom">'+its.slice(0,4).map(x=>'<button class="'+(view===x[0]?'on':'')+'" onclick="K.go(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'<button onclick="K.toggleMenu()">Mehr</button></div></div>'}
function head(title,sub){return '<div class="hero"><span class="pill">'+(profile.role==='management'?'BÜRO':'MOBIL')+'</span><h1>'+esc(title)+'</h1><p>'+esc(sub)+'</p></div>'}
function renderApp(){let html='';try{html=({dashboard:pageDashboard,planning:pagePlanning,people:pagePeople,customers:pageCustomers,time:pageTime,absences:pageAbsences,workslips:pageWorkslips,tasks:pageTasks,invoices:pageInvoices,users:pageUsers,admin:pageAdmin,integrations:pageIntegrations,compliance:pageCompliance,legal:pageLegal}[view]||pageDashboard)()}catch(e){html='<div class="error">'+esc(e.message||e)+'</div>'}shell(html)}
function pageDashboard(){const mg=profile.role==='management';if(!mg){const next=(data.assignments||[]).find(a=>a.status!=='completed'&&a.status!=='cancelled');const running=(data.time||[]).find(t=>!t.ended_at);return head('Mein Arbeitstag','Eigene Einsätze, Zeit und Meldungen')+'<div class="grid"><div class="card c6"><h2>Nächster Einsatz</h2>'+(next?'<p><b>'+fmt(next.starts_at)+'</b></p><p>'+esc(next.notes||'Keine Hinweise')+'</p><button class="btn" onclick="K.go(\'planning\')">Einsatz öffnen</button>':'<p class="muted">Kein offener Einsatz.</p>')+'</div><div class="card c6"><h2>Zeiterfassung</h2>'+(running?'<p class="ok"><b>Zeit läuft seit '+fmt(running.started_at)+'</b></p><button class="btn danger" onclick="K.stopTime(\''+running.id+'\')">Zeit stoppen</button>':'<p class="muted">Keine laufende Buchung.</p><button class="btn" onclick="K.go(\'time\')">Zeit erfassen</button>')+'</div></div>'}const pending=(data.profiles||[]).filter(p=>p.approval_status==='pending').length,conf=(data.assignments||[]).filter(a=>a.status==='conflict').length,abs=(data.absences||[]).filter(a=>a.absence_type==='vacation_requested').length,blocks=(data.compliance||[]).filter(g=>g.status!=='PASS').length;return head('Tagessteuerung','Betrieb, Freigaben und gesetzliche Gates')+'<div class="grid"><div class="card c3"><div class="muted">Offene Benutzer</div><div class="kpi">'+pending+'</div></div><div class="card c3"><div class="muted">Planungskonflikte</div><div class="kpi">'+conf+'</div></div><div class="card c3"><div class="muted">Urlaub offen</div><div class="kpi">'+abs+'</div></div><div class="card c3"><div class="muted">Compliance nicht PASS</div><div class="kpi">'+blocks+'</div></div><div class="card c6"><h2>Schnellzugriff</h2><div class="actions"><button class="btn" onclick="K.go(\'planning\')">Einsatz planen</button><button class="btn alt" onclick="K.go(\'users\')">Benutzer freigeben</button><button class="btn alt" onclick="K.go(\'time\')">Zeiten exportieren</button><button class="btn alt" onclick="K.go(\'admin\')">Administration & Recht</button></div></div><div class="card c6"><h2>Produktionsstatus</h2><div class="notice"><b>FIELDTEST.</b> Produktion bleibt gesperrt, bis alle MUSS-Gates und externe Nachweise PASS sind.</div></div></div>'}
function pagePlanning(){const mg=profile.role==='management';let rows=(data.assignments||[]);return head(mg?'Einsatzplanung':'Meine Einsätze','Wiederkehrende und einzelne Einsätze; Änderungen werden nach Synchronisierung sichtbar')+(mg?'<div class="card"><h2>Neuen Einsatz anlegen</h2><div class="row3"><select id="plObject"><option value="">Objekt wählen</option>'+(data.objects||[]).map(o=>'<option value="'+o.id+'">'+esc(o.name)+' · '+esc(o.address)+'</option>').join('')+'</select><select id="plEmployee"><option value="">Mitarbeiter wählen</option>'+(data.profiles||[]).filter(p=>p.approval_status==='approved'&&p.role==='employee').map(p=>'<option value="'+p.user_id+'">'+esc(p.full_name||p.email)+'</option>').join('')+'</select><input id="plStart" type="datetime-local"></div><div class="row"><input id="plMinutes" type="number" min="1" value="120" placeholder="Minuten"><input id="plNotes" placeholder="Hinweise"></div><button class="btn" onclick="K.createAssignment()">Einsatz speichern</button></div><div class="spacer"></div>':'')+'<div class="card tablewrap"><table class="table"><tr><th>Start</th><th>Dauer</th><th>Status</th><th>Hinweise</th>'+(mg?'<th>Mitarbeiter</th>':'')+'</tr>'+rows.map(a=>'<tr><td>'+fmt(a.starts_at)+'</td><td>'+a.planned_minutes+' min</td><td><span class="pill">'+esc(a.status)+'</span></td><td>'+esc(a.notes||'')+'</td>'+(mg?'<td>'+esc((data.profiles||[]).find(p=>p.user_id===a.employee_user_id)?.full_name||'—')+'</td>':'')+'</tr>').join('')+'</table></div>'}
function pagePeople(){return head('Personal','Mitarbeiterakte, Eintritt und Sofortmeldungsstatus')+'<div class="card tablewrap"><table class="table"><tr><th>Name</th><th>E-Mail</th><th>Rolle</th><th>Freigabe</th><th>Eintritt</th><th>Sofortmeldung</th></tr>'+(data.profiles||[]).map(p=>'<tr><td>'+esc(p.full_name||'—')+'</td><td>'+esc(p.email)+'</td><td>'+esc(p.role)+'</td><td>'+esc(p.approval_status)+'</td><td>'+esc(p.employment_start||'—')+'</td><td>'+esc(p.instant_report_status||'—')+'</td></tr>').join('')+'</table></div>'}
function pageCustomers(){return head('Kunden & Objekte','Stammdaten, §13b-Kennzeichen und Einsatzorte')+'<div class="grid"><div class="card c6"><h2>Kunde anlegen</h2><input id="cuName" placeholder="Kundenname"><div class="row"><input id="cuAddress" placeholder="Adresse"><input id="cuEmail" type="email" placeholder="E-Mail"></div><label class="check"><input id="cu13b" type="checkbox"> §13b Gebäudereinigung / USt 1 TG</label><button class="btn" onclick="K.createCustomer()">Kunde speichern</button></div><div class="card c6"><h2>Objekt anlegen</h2><select id="obCustomer"><option value="">Kunde wählen</option>'+(data.customers||[]).map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select><div class="row"><input id="obName" placeholder="Objektname"><input id="obAddress" placeholder="Anschrift"></div><button class="btn" onclick="K.createObject()">Objekt speichern</button></div><div class="card c12 tablewrap"><table class="table"><tr><th>Kunde</th><th>Adresse</th><th>§13b</th><th>Objekte</th></tr>'+(data.customers||[]).map(c=>'<tr><td><b>'+esc(c.name)+'</b></td><td>'+esc(c.address||'')+'</td><td>'+(c.is_13b?'Ja':'Nein')+'</td><td>'+(data.objects||[]).filter(o=>o.customer_id===c.id).map(o=>esc(o.name)+' · '+esc(o.address)).join('<br>')+'</td></tr>').join('')+'</table></div></div>'}

function legalText(which){const c=(data.company||[])[0]||{};if(which==='privacy')return '<h2>Datenschutzhinweise – Feldtest</h2><p>Verantwortlicher: '+esc(c.legal_name||'durch Geschäftsführung einzutragen')+', '+esc(c.street||'')+' '+esc(c.postal_code||'')+' '+esc(c.city||'')+'. Kontakt: '+esc(c.privacy_contact||c.email||'einzutragen')+'.</p><p>Die App verarbeitet Kontodaten, Beschäftigtendaten, Einsatz-, Zeit-, Abwesenheits- und Arbeitsscheindaten zur Durchführung des Beschäftigungs- und Betriebsverhältnisses. Krankmeldungen werden als besonders schutzbedürftige Daten behandelt; eine Diagnose ist nicht vorgesehen.</p><p>Mandantentrennung und Rollenrechte begrenzen den Zugriff. Betroffenenanfragen können als Auskunft, Berichtigung, Löschung, Einschränkung oder Portabilität erfasst werden. Gesetzliche Aufbewahrungspflichten können einer sofortigen Löschung entgegenstehen.</p><p><b>Produktionshinweis:</b> Finale Rechtsprüfung, AV-Verträge, TOM und deutsches Produktionshosting sind vor Livebetrieb nachzuweisen.</p>';if(which==='imprint')return '<h2>Impressum / Anbieterangaben</h2><p><b>'+esc(c.legal_name||'Bitte Firmendaten in Administration & Recht eintragen')+'</b><br>'+esc(c.street||'')+'<br>'+esc(c.postal_code||'')+' '+esc(c.city||'')+'</p><p>Vertreten durch: '+esc(c.managing_director||'einzutragen')+'<br>E-Mail: '+esc(c.email||'einzutragen')+'<br>Telefon: '+esc(c.phone||'einzutragen')+'<br>USt-IdNr.: '+esc(c.vat_id||'einzutragen')+'</p>';return '<h2>Nutzungsbedingungen – Feldtest</h2><p>Diese Version dient dem kontrollierten Feldtest. Nur freigegebene Benutzer dürfen zugreifen. Zugangsdaten dürfen nicht geteilt werden. Geschäftsführung verwaltet Rollen, Rechte und Schnittstellen.</p><p>Produktive Rechnungs-, eAU-, Sofortmeldungs-, Steuerberater- und Drittanbieterprozesse dürfen erst genutzt werden, wenn die zugehörigen Compliance-Gates PASS sind.</p>'}

function initSignature(){const c=document.getElementById('sig');if(!c)return;c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;const x=c.getContext('2d');x.scale(devicePixelRatio,devicePixelRatio);x.lineWidth=2;x.lineCap='round';let down=false;const pos=e=>{const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return[p.clientX-r.left,p.clientY-r.top]};const st=e=>{down=true;const p=pos(e);x.beginPath();x.moveTo(...p);e.preventDefault()},mv=e=>{if(!down)return;const p=pos(e);x.lineTo(...p);x.stroke();e.preventDefault()},en=e=>{down=false;e.preventDefault()};c.addEventListener('mousedown',st);c.addEventListener('mousemove',mv);c.addEventListener('mouseup',en);c.addEventListener('touchstart',st,{passive:false});c.addEventListener('touchmove',mv,{passive:false});c.addEventListener('touchend',en,{passive:false})}
async function submitWorkslip(){const c=document.getElementById('sig');await rpc('kalnbach_submit_workslip',{p_assignment:document.getElementById('wsAssignment').value,p_notes:document.getElementById('wsNotes').value,p_signer:document.getElementById('wsSigner').value,p_signature:c?c.toDataURL('image/png'):''});flash('Arbeitsschein eingereicht');await reload()}

async function createInvoice(){const cid=document.getElementById('invCustomer').value,c=(data.customers||[]).find(x=>x.id===cid);await api('/rest/v1/kalnbach_invoices',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({tenant_id:profile.tenant_id,customer_id:cid,invoice_no:document.getElementById('invNo').value,invoice_type:document.getElementById('invType').value,amount_net:Number(document.getElementById('invAmount').value||0),vat_rate:c?.is_13b?0:19,reverse_charge_13b:!!c?.is_13b,einvoice_format:document.getElementById('invFormat').value||null,created_by:session.user.id})});flash('Rechnungsentwurf gespeichert');await reload()}
async function releaseInvoice(id){const r=await rpc('kalnbach_release_invoice',{p_id:id});if(r?.status==='BLOCK')throw new Error(r.reason||'Freigabe blockiert');flash('Rechnung freigegeben');await reload()}

async function exportTimes(kind){const f=document.getElementById('exFrom').value,t=document.getElementById('exTo').value,e=document.getElementById('exEmployee').value||null;if(!f||!t)throw new Error('Zeitraum wählen');const rows=await rpc('kalnbach_time_export',{p_from:f,p_to:t,p_employee:e});const cols=['Mitarbeiter','Datum','Beginn','Ende','Minuten','Quelle','Änderungsgrund'];const csv=[cols.join(';'),...(rows||[]).map(r=>[r.employee_name,r.work_date,r.started_at||'',r.ended_at||'',r.minutes??'',r.source||'',r.edit_reason||''].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';'))].join('\n');const lines=cols.join(' | ')+'\n'+(rows||[]).map(r=>[r.employee_name,r.work_date,fmt(r.started_at),fmt(r.ended_at),r.minutes??'',r.source||'',r.edit_reason||''].join(' | ')).join('\n');const base='Kalnbach-Arbeitszeiten-'+f+'-'+t;if(kind==='pdf'&&window.KalnbachNative)KalnbachNative.savePdf(base+'.pdf','Kalnbach Arbeitszeit-Prüfungsexport '+f+' bis '+t,lines);else if(window.KalnbachNative)KalnbachNative.saveText(base+'.csv','text/csv',csv);else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=base+'.csv';a.click()}flash('Export erstellt')}
