<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12384b">
<title>Kalnbach Operations</title>
<style>
:root{--nav:#102f3f;--nav2:#173f54;--accent:#287292;--bg:#f3f6f7;--card:#fff;--ink:#17252d;--muted:#71808a;--line:#dbe4e8;--ok:#187659;--warn:#a66512;--bad:#a53a3a;--soft:#edf3f5}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.app{min-height:100vh}.top{background:var(--nav);color:#fff;padding:13px 16px;position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:850;letter-spacing:-.02em}.wrap{max-width:1180px;margin:auto;padding:14px 12px 88px}.hero{background:linear-gradient(135deg,#12384b,#22617c);color:#fff;padding:24px;border-radius:20px;margin:8px 0 16px;box-shadow:0 12px 35px rgba(15,48,64,.16)}.hero h1{font-size:31px;line-height:1.05;margin:9px 0}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 4px 16px rgba(20,50,65,.05)}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}.kpi{font-size:32px;font-weight:850;letter-spacing:-.05em}.muted{color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:var(--soft);font-size:11px;font-weight:750}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.btn{border:0;background:var(--accent);color:#fff;padding:11px 13px;border-radius:10px;font-weight:800;cursor:pointer}.btn.alt{background:#fff;color:#244553;border:1px solid var(--line)}.btn.green{background:var(--ok)}.btn.danger{background:#9f3d3d}.actions{display:flex;gap:8px;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid #e5ecef;text-align:left;vertical-align:top}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}.login{max-width:760px;margin:5vh auto;padding:12px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice{min-height:225px;display:flex;flex-direction:column;justify-content:space-between}.note{padding:12px;border-radius:10px;background:#fff8e9;border:1px solid #eed59a}.bottom{display:flex;position:fixed;left:8px;right:8px;bottom:8px;background:rgba(16,47,63,.97);border-radius:14px;padding:6px;z-index:40;box-shadow:0 10px 35px rgba(10,32,43,.3)}.bottom button{flex:1;border:0;background:transparent;color:#cfe1e8;padding:9px 6px;border-radius:9px;font-size:11px}.bottom button.on{background:#285b72;color:#fff}.sig{height:130px;width:100%;background:#fff;border:1px dashed #9cb0ba;border-radius:10px;touch-action:none}.error{margin:16px;padding:14px;border-radius:10px;background:#fff0f0;border:1px solid #e9b8b8;color:#7e2525}@media(max-width:800px){.c3,.c4,.c6,.c8{grid-column:span 12}.choices{grid-template-columns:1fr}.hero h1{font-size:28px}.table{font-size:12px}.wrap{padding-bottom:92px}}
</style>
</head>
<body><div id="app"></div>
<script>
(function(){
const app=document.getElementById('app');
let role=null,view='start',tenant='Robert Kalnbach',timerStart=0,timerTick=null;
const assignments=[
 {time:'18:30',customer:'Demo Bürozentrum GmbH',object:'Musterstraße 10, Bad Hersfeld',employee:'Demo Mitarbeiterin A',status:'offen'},
 {time:'18:00',customer:'Demo Praxis OHG',object:'Bahnhofstraße 7, Fulda',employee:'Demo Mitarbeiter B',status:'Konflikt'}
];
function safe(fn){try{fn()}catch(e){app.innerHTML='<div class="error"><b>App-Fehler</b><br>'+String(e&&e.message||e)+'</div>'}}
function top(){return '<div class="top"><div class="brand">Kalnbach Operations</div><div>'+(role==='management'?'Geschäftsführung':'Mitarbeiter')+' · <button class="btn alt" style="padding:6px 9px" onclick="window.K.logout()">Abmelden</button></div></div>'}
function pill(txt,cls=''){return '<span class="pill '+cls+'">'+txt+'</span>'}
function login(){app.innerHTML='<div class="login"><div class="hero">'+pill('ANDROID APP · OFFLINE-SAFE')+'<h1>Kalnbach Operations</h1><p>Eigenständige Feldtest-App für Gebäudereinigung. Kein Clerk, kein Showroom und keine PIGA-Enterprise-Anmeldung.</p></div><div class="choices"><div class="card choice"><div>'+pill('BÜRO')+'<h2>Geschäftsführung</h2><p class="muted">Einsatzplanung, Personal, Kunden & Objekte, Zeiten, Arbeitsscheine und Rechnungsstatus.</p></div><button class="btn" onclick="window.K.login(\'management\')">Geschäftsführung öffnen</button></div><div class="card choice"><div>'+pill('MOBIL')+'<h2>Mitarbeiter</h2><p class="muted">Heutige Einsätze, Zeitstart/-stopp, Urlaub und Arbeitsschein.</p></div><button class="btn" onclick="window.K.login(\'employee\')">Mitarbeiter öffnen</button></div></div><p class="muted" style="text-align:center;margin-top:16px">Feldtest mit synthetischen Demo-Daten.</p></div>'}
function nav(){const items=role==='management'?[['start','Start'],['plan','Planung'],['people','Personal'],['docs','Belege']]:[['start','Heute'],['time','Zeit'],['leave','Urlaub'],['slip','Schein']];return '<div class="bottom">'+items.map(x=>'<button class="'+(view===x[0]?'on':'')+'" onclick="window.K.view(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div>'}
function management(){let body='';if(view==='start')body='<div class="hero">'+pill('GESCHÄFTSFÜHRUNG')+'<h1>Tagessteuerung</h1><p>'+tenant+' · Feldtest</p><div class="actions"><button class="btn green" onclick="window.K.view(\'plan\')">Einsatzplanung</button><button class="btn alt" onclick="window.K.view(\'people\')">Personal</button></div></div><div class="grid"><div class="card c3"><div class="muted">Anwesend</div><div class="kpi">1</div>'+pill('Personalstatus','ok')+'</div><div class="card c3"><div class="muted">Einsätze heute</div><div class="kpi">2</div>'+pill('Planung')+'</div><div class="card c3"><div class="muted">Konflikte</div><div class="kpi">1</div>'+pill('Vertretung nötig','bad')+'</div><div class="card c3"><div class="muted">Urlaub offen</div><div class="kpi">1</div>'+pill('Prüfen','warn')+'</div><div class="card c8"><h2>Einsatzplanung</h2>'+assignmentTable()+'</div><div class="card c4"><h2>Offene Punkte</h2><p><b>Vertretung erforderlich</b><br><span class="muted">Demo Praxis OHG</span></p><p><b>Urlaubsantrag</b><br><span class="muted">04.–05.09.2026</span></p><p><b>Rechnung R-2026-1043</b><br><span class="muted">Prüfung offen</span></p></div></div>';
if(view==='plan')body='<div class="hero"><h1>Einsatzplanung</h1><p>Heute · '+tenant+'</p></div><div class="card">'+assignmentTable()+'<br><button class="btn" onclick="alert(\'Feldtest: neuer Einsatz vorbereitet\')">+ Einsatz planen</button></div>';
if(view==='people')body='<div class="hero"><h1>Personal</h1><p>Anwesenheit und Arbeitszeit</p></div><div class="card"><table class="table"><tr><th>Name</th><th>Status</th><th>Heute</th><th>Woche</th></tr><tr><td>Demo Mitarbeiterin A</td><td class="ok">anwesend</td><td>5,5 h</td><td>30 h</td></tr><tr><td>Demo Mitarbeiter B</td><td class="bad">krank</td><td>0 h</td><td>40 h</td></tr></table></div>';
if(view==='docs')body='<div class="hero"><h1>Belege & Kontrolle</h1><p>Arbeitsscheine, Rechnungen, Migration</p></div><div class="grid"><div class="card c6"><h2>Arbeitsschein AS-2044</h2><p>Musterstraße 10</p>'+pill('offen','warn')+'</div><div class="card c6"><h2>Rechnung R-2026-1042</h2><p>1.480,00 €</p>'+pill('Freigegeben · gesperrt','ok')+'</div><div class="card c12"><h2>Migration fortytools</h2><div class="note"><b>BLOCK</b> bis reale Schnittstelle, Mengenabgleich und AG-Freigabe vorliegen.</div></div></div>';
app.innerHTML=top()+'<div class="wrap">'+body+'</div>'+nav()}
function assignmentTable(){return '<table class="table"><tr><th>Zeit</th><th>Kunde / Objekt</th><th>Mitarbeiter</th><th>Status</th></tr>'+assignments.map(a=>'<tr><td>'+a.time+'</td><td><b>'+a.customer+'</b><br><span class="muted">'+a.object+'</span></td><td>'+a.employee+'</td><td>'+pill(a.status,a.status==='Konflikt'?'bad':'ok')+'</td></tr>').join('')+'</table>'}
function employee(){let body='';if(view==='start')body='<div class="hero">'+pill('MITARBEITER')+'<h1>Mein Arbeitstag</h1><p>Demo Mitarbeiterin A · '+tenant+'</p></div><div class="card"><span class="pill">HEUTE · 18:30</span><h2>Demo Bürozentrum GmbH</h2><p>Musterstraße 10, Bad Hersfeld</p><p class="muted">Unterhaltsreinigung · 120 Minuten</p><div class="actions"><button class="btn green" onclick="window.K.view(\'time\')">Zeit erfassen</button><button class="btn alt" onclick="window.K.view(\'slip\')">Arbeitsschein</button></div></div>';
if(view==='time')body='<div class="hero"><h1>Zeiterfassung</h1><p>Demo Bürozentrum GmbH</p></div><div class="card"><div class="muted">Laufende Zeit</div><div id="clock" class="kpi">00:00:00</div><div class="actions"><button class="btn green" onclick="window.K.startTimer()">Start</button><button class="btn danger" onclick="window.K.stopTimer()">Stopp</button></div></div>';
if(view==='leave')body='<div class="hero"><h1>Urlaub</h1><p>Eigene Anträge</p></div><div class="card"><h2>04.09.–05.09.2026</h2>'+pill('beantragt','warn')+'<p class="muted">Feldtest-Datensatz</p><button class="btn alt" onclick="alert(\'Feldtest: neuer Urlaubsantrag vorbereitet\')">Neuen Antrag vorbereiten</button></div>';
if(view==='slip')body='<div class="hero"><h1>Arbeitsschein</h1><p>AS-2044 · Musterstraße 10</p></div><div class="card"><label>Notiz</label><textarea style="width:100%;min-height:90px;margin:8px 0" placeholder="Bemerkung"></textarea><div class="sig"></div><p class="muted">Unterschrift-Feld · Feldtest</p><button class="btn" onclick="alert(\'Arbeitsschein im Feldtest bestätigt\')">Bestätigen</button></div>';
app.innerHTML=top()+'<div class="wrap">'+body+'</div>'+nav(); if(view==='time')drawClock()}
function render(){safe(()=>{if(!role)return login();role==='management'?management():employee()})}
function drawClock(){const c=document.getElementById('clock');if(!c)return;const ms=timerStart?Date.now()-timerStart:0;const s=Math.floor(ms/1000);const h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor((s%3600)/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');c.textContent=h+':'+m+':'+ss}
window.K={login(r){role=r;view='start';render()},logout(){role=null;view='start';if(timerTick)clearInterval(timerTick);render()},view(v){view=v;render()},startTimer(){if(!timerStart)timerStart=Date.now();if(timerTick)clearInterval(timerTick);timerTick=setInterval(drawClock,1000);drawClock()},stopTimer(){timerStart=0;if(timerTick)clearInterval(timerTick);timerTick=null;drawClock();alert('Feldtest: Zeitstopp dokumentiert')}};
window.onerror=function(msg){app.innerHTML='<div class="error"><b>App-Fehler</b><br>'+String(msg)+'</div>';return true};
render();
})();
</script></body></html>
