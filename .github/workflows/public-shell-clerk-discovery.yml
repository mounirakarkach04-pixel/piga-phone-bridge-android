name: PIGA Configured Upstream Probe

on:
  push:
    branches:
      - ops/public-shell-clerk-discovery-20260827

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe configured production API through governed edge
        shell: bash
        run: |
          set -euo pipefail
          for path in /healthz /api/health; do
            echo "=== GET https://pigapocket.com${path} ==="
            curl -sS -D /tmp/headers -o /tmp/body -w 'status=%{http_code}\n' "https://pigapocket.com${path}" || true
            sed -n '1,80p' /tmp/headers
            head -c 1200 /tmp/body || true
            echo
          done
          echo '=== POST challenge invalid body ==='
          curl -sS -D /tmp/headers -o /tmp/body -w 'status=%{http_code}\n' -X POST -H 'content-type: application/json' --data '{}' https://pigapocket.com/api/bridge/pairing/challenge || true
          sed -n '1,80p' /tmp/headers
          head -c 1200 /tmp/body || true
          echo
          echo '=== POST confirm invalid body ==='
          curl -sS -D /tmp/headers -o /tmp/body -w 'status=%{http_code}\n' -X POST -H 'content-type: application/json' --data '{}' https://pigapocket.com/api/bridge/pairing/confirm || true
          sed -n '1,80p' /tmp/headers
          head -c 1200 /tmp/body || true
          echo
