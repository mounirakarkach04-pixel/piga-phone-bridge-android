name: Pairing Web Surface Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pairing-web-surface-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect deployed pairing bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request, urllib.parse
          root = 'https://app.pigapocket.com/device-pairing'
          req = urllib.request.Request(root, headers={'User-Agent':'PIGA-Pairing-Probe/1.0'})
          html = urllib.request.urlopen(req, timeout=20).read().decode('utf-8','replace')
          base = 'https://app.pigapocket.com/'
          assets = re.findall(r'(?:src|href)=["\']([^"\']+\.js(?:\?[^"\']*)?)["\']', html)
          texts = [html]
          urls = ['HTML']
          for asset in assets[:40]:
              url = urllib.parse.urljoin(base, asset)
              try:
                  texts.append(urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'PIGA-Pairing-Probe/1.0'}), timeout=20).read().decode('utf-8','replace'))
                  urls.append(url)
              except Exception as exc:
                  print('asset fetch failed', url, type(exc).__name__)
          joined = '\n'.join(texts)
          print('HTTP surface bytes:', len(html))
          print('assets:', urls)
          print('bundle bytes:', len(joined))
          markers = ['PIGA Pocket Bridge','pigapocketbridge','Dieses Handy bestätigen','ersten Besitzer','Besitzer-Freigabe','first-owner','bootstrap/start','ownerClaim']
          for marker in markers:
              print(f'MARKER {marker!r}:', 'PASS' if marker in joined else 'MISSING')
          for needle in ['Besitzer','pigapocketbridge','first-owner','ownerClaim']:
              print('--- SNIPPETS', needle, '---')
              starts = [m.start() for m in re.finditer(re.escape(needle), joined, flags=re.I)][:12]
              for pos in starts:
                  snippet = joined[max(0,pos-180):pos+360].replace('\n',' ')
                  print(snippet)
          PY
