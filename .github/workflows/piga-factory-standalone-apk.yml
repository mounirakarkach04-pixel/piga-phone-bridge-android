name: PIGA Factory Standalone APK

on:
  push:
    branches: ["release/piga-factory-standalone-1.0"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: JVM unit tests
        run: gradle :app:testDebugUnitTest --build-cache --parallel --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --build-cache --parallel --stacktrace

      - name: Build standalone Factory APK
        run: gradle :app:assembleDebug --build-cache --parallel --stacktrace

      - name: Verify APK exists and hash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/PIGA-Factory-1.0.0-preview.apk.sha256
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PIGA-Factory-1.0.0-preview.apk

      - name: Upload standalone Factory APK
        uses: actions/upload-artifact@v4
        with:
          name: piga-factory-standalone-apk
          path: |
            app/build/outputs/apk/debug/PIGA-Factory-1.0.0-preview.apk
            app/build/outputs/apk/debug/PIGA-Factory-1.0.0-preview.apk.sha256
          if-no-files-found: error
          retention-days: 30
