name: Android Debug APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python for synchronization gate
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify PIGA cross-plane synchronization
        run: python scripts/check_piga_sync.py

      - name: Bind APK to Pocket Enterprise control plane
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/io/piga/phonebridge/PairingActivity.kt')
          s = p.read_text()
          old = 'https://d62aa607-3fcc-4f10-b437-8dd3326c4f3f-00-1iesyu3mfpkl2.janeway.replit.dev'
          new = 'https://ee08874a-6e9f-4d86-9942-9371a86f6c3e-00-3myurbngr26bi.janeway.replit.dev'
          if old not in s:
              raise SystemExit('Expected legacy control-plane URL not found; fail closed')
          s = s.replace(old, new)
          s = s.replace('setText(prefs.getString("base_url", defaultBaseUrl) ?: defaultBaseUrl)', 'setText(defaultBaseUrl)')
          p.write_text(s)
          print('Pocket Enterprise control-plane binding prepared')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: JVM unit tests
        run: gradle :app:testDebugUnitTest --build-cache --parallel --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --build-cache --parallel --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --build-cache --parallel --stacktrace

      - name: Hash APK
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK and hash
        uses: actions/upload-artifact@v4
        with:
          name: piga-phone-bridge-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
