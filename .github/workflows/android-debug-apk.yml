name: Android Debug APK

on:
  push:
    branches: ["main", "codex/frictionless-pairing-20260826"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python for synchronization gate
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify PIGA cross-plane synchronization
        id: piga_sync
        continue-on-error: true
        run: python scripts/check_piga_sync.py

      - name: Verify canonical control-plane discovery manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          p = Path('control-plane.json')
          data = json.loads(p.read_text())
          assert data['schema'] == 'piga.control-plane-discovery.v1'
          assert int(data['epoch']) > 0
          assert data['governance']['mode'] == 'fail-closed'
          assert data['governance']['materialChangeRequiresReEntry'] is True
          u = urlparse(data['controlPlaneUrl'])
          assert u.scheme == 'https' and u.hostname and not u.username and not u.password
          assert not u.query and not u.fragment
          print('Canonical control-plane discovery manifest: PASS')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: JVM unit tests
        run: gradle :app:testDebugUnitTest --build-cache --parallel --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --build-cache --parallel --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --build-cache --parallel --stacktrace

      - name: Hash APK
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK and hash
        uses: actions/upload-artifact@v4
        with:
          name: piga-phone-bridge-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

      - name: Enforce cross-plane synchronization gate
        if: steps.piga_sync.outcome != 'success'
        run: |
          echo 'PIGA cross-plane synchronization remains unresolved.' >&2
          exit 1
