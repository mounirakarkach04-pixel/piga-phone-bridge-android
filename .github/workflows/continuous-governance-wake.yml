name: PIGA Continuous Governance Wake

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continuous-governance-wake.yml'
      - 'control-plane.json'
  workflow_dispatch:
  repository_dispatch:
    types: [piga-governance-wake]
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: piga-continuous-governance-wake
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Resolve canonical control plane
        id: control
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/control-plane.json"
          JSON="$(curl --fail --silent --show-error --location --max-time 15 "$MANIFEST")"
          ROOT="$(python -c 'import json,sys; print(json.load(sys.stdin)["controlPlaneUrl"].rstrip("/"))' <<<"$JSON")"
          test "$ROOT" = "https://pigapocket.com"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Probe admitted control-plane health
        id: probe
        env:
          ROOT: ${{ steps.control.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl --silent --show-error --location --max-time 15 \
            --output /tmp/piga-health.json \
            --write-out '%{http_code}' \
            "$ROOT/api/health" || true)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=CONTROL_PLANE_HEALTH_HTTP_${HTTP_CODE:-000}" >> "$GITHUB_OUTPUT"
            echo "Branch-local DELAY: control plane is not ready; no authority was created."
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/piga-health.json').read_text())
          assert payload.get('schema') == 'piga.control-plane-health.v1'
          assert payload.get('status') in {'ALLOW', 'IDLE', 'HEARTBEAT'}
          assert payload.get('authority') == 'none'
          assert payload.get('engineCount') == 5
          assert payload.get('additionalEngineCreated') is False
          assert payload.get('a7semReverseIsEngine') is False
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "reason=HEALTH_ADMITTED" >> "$GITHUB_OUTPUT"

      - name: Obtain GitHub OIDC token
        if: steps.probe.outputs.ready == 'true'
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          AUDIENCE="piga-pocket-enterprise"
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$RESPONSE")"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Drive admitted cycles immediately
        if: steps.probe.outputs.ready == 'true'
        id: drive
        env:
          ROOT: ${{ steps.control.outputs.root }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          more="true"
          cycles=0
          max_cycles=50
          last='{}'
          while [ "$more" = "true" ] && [ "$cycles" -lt "$max_cycles" ]; do
            cycles=$((cycles + 1))
            trigger_id="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${cycles}"
            last="$(curl --fail --silent --show-error --location --max-time 45 \
              -X POST "$ROOT/api/factory/trigger/next" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "X-PIGA-Trigger-Id: $trigger_id" \
              -H "X-PIGA-Trigger-Event: continuous-governance-wake" \
              -H "X-PIGA-Trigger-Source: github-actions" \
              -H "X-PIGA-Trigger-Repository: $GITHUB_REPOSITORY" \
              --data '{"reason":"continuous-governance-wake","engineCount":5,"createAdditionalEngine":false}')"
            more="$(python -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("moreReady", False))).lower())' <<<"$last")"
            status="$(python -c 'import json,sys; print(json.load(sys.stdin).get("status","UNKNOWN"))' <<<"$last")"
            echo "cycle=$cycles status=$status moreReady=$more"
            case "$status" in
              PASS|ALLOW|READY|RUNNING|IDLE|HEARTBEAT|DELAY|WAITING|CIRCUIT_OPEN|BLOCK|BLOCKED|UNKNOWN|EXPIRED) ;;
              *) echo "Unexpected trigger status; fail closed" >&2; exit 1;;
            esac
            if [ "$more" = "true" ]; then sleep 1; fi
          done
          echo "cycles=$cycles" >> "$GITHUB_OUTPUT"
          echo "more=$more" >> "$GITHUB_OUTPUT"

      - name: Immediate continuation dispatch
        if: steps.probe.outputs.ready == 'true' && steps.drive.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"event_type":"piga-governance-wake","client_payload":{"reason":"immediate-continuation"}}'

      - name: Governance heartbeat summary
        if: always()
        shell: bash
        run: |
          {
            echo '### PIGA Continuous Governance Wake'
            echo "- Control plane: ${{ steps.control.outputs.root }}"
            echo "- Probe: ${{ steps.probe.outputs.reason }}"
            echo "- Cycles: ${{ steps.drive.outputs.cycles || '0' }}"
            echo "- More ready: ${{ steps.drive.outputs.more || 'false' }}"
            echo '- Engine count: 5'
            echo '- Additional engine created: false'
            echo '- A7SEM Reverse is engine: false'
          } >> "$GITHUB_STEP_SUMMARY"
