name: AEIOU Visual Web App

on:
  push:
    branches:
      - factory/aeiou-shell-public-runner-20260903
    paths:
      - 'aeiou-web/**'
      - '.github/workflows/aeiou-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: factory/aeiou-shell-public-runner-20260903
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload AEIOU site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./aeiou-web
      - name: Deploy AEIOU site
        id: deployment
        uses: actions/deploy-pages@v4
