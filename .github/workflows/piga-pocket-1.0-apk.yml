name: PIGA Pocket 1.0 APK

on:
  push:
    branches: ["release/piga-pocket-1.0"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify PIGA synchronization
        run: python scripts/check_piga_sync.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --build-cache --parallel --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --build-cache --parallel --stacktrace

      - name: Build PIGA Pocket 1.0 APK
        run: gradle :app:assembleDebug --build-cache --parallel --stacktrace

      - name: Package APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PIGA-Pocket-1.0.0.apk
          sha256sum app/build/outputs/apk/debug/PIGA-Pocket-1.0.0.apk > app/build/outputs/apk/debug/PIGA-Pocket-1.0.0.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PIGA-Pocket-1.0.0-APK
          path: |
            app/build/outputs/apk/debug/PIGA-Pocket-1.0.0.apk
            app/build/outputs/apk/debug/PIGA-Pocket-1.0.0.apk.sha256
          if-no-files-found: error
          retention-days: 30
