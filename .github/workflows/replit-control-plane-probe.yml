name: PIGA Replit Control Plane Candidate Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replit-control-plane-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piga-replit-control-plane-candidate
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe published candidate read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          base='https://piga-executor-client.replit.app'
          for spec in \
            'api-health:/api/health' \
            'api-healthz:/api/healthz' \
            'pairing-challenge:/api/bridge/pairing/challenge' \
            'pairing-status:/api/bridge/pairing/status' \
            'device-health:/api/device-control/health' \
            'factory-next:/api/factory/trigger/next' \
            'root:/'; do
            name="${spec%%:*}"
            path="${spec#*:}"
            curl --silent --show-error --location --max-redirs 3 --max-time 25 \
              -D "evidence/${name}.headers" \
              -o "evidence/${name}.body" \
              -w '%{http_code}\n%{url_effective}\n' \
              "${base}${path}" > "evidence/${name}.meta" || true
          done

      - name: Assess A7SEM control-plane identity
        id: assess
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('evidence')
          def read(name):
              p = root / name
              return p.read_text(errors='replace') if p.exists() else ''
          def meta(name):
              lines = [x.strip() for x in read(f'{name}.meta').splitlines() if x.strip()]
              return {
                  'http': int(lines[0]) if lines and lines[0].isdigit() else 0,
                  'effectiveUrl': lines[1] if len(lines) > 1 else None,
              }
          def body_json(name):
              try:
                  return json.loads(read(f'{name}.body'))
              except Exception:
                  return None

          health_meta = meta('api-health')
          health = body_json('api-health')
          contract_ok = (
              health_meta['http'] == 200
              and isinstance(health, dict)
              and health.get('schema') == 'piga.control-plane-health.v1'
              and health.get('status') in {'ALLOW', 'IDLE', 'HEARTBEAT', 'AUTO_STOP'}
              and health.get('authority') == 'none'
              and health.get('engineCount') == 5
              and health.get('additionalEngineCreated') is False
              and health.get('a7semReverseIsEngine') is False
          )
          endpoint_names = ['pairing-challenge','pairing-status','device-health','factory-next']
          endpoint_meta = {name: {'meta': meta(name), 'body': body_json(name)} for name in endpoint_names}
          exposed = [name for name, item in endpoint_meta.items() if item['meta']['http'] not in {0,404}]
          receipt = {
              'schema': 'piga.backend-origin-candidate.v2',
              'governance': 'A7SEM -> read-only candidate probe -> evidence -> A7SEM Reverse',
              'authority': 'none',
              'candidateOrigin': 'https://piga-executor-client.replit.app',
              'apiHealth': {'meta': health_meta, 'body': health},
              'apiHealthz': {'meta': meta('api-healthz'), 'body': body_json('api-healthz')},
              'endpointEvidence': endpoint_meta,
              'exposedCandidateEndpoints': exposed,
              'root': {'meta': meta('root')},
              'result': 'PASS' if contract_ok else 'BLOCK',
              'reason': 'CONTROL_PLANE_CONTRACT_ADMITTED' if contract_ok else 'CONTROL_PLANE_CONTRACT_NOT_PROVEN',
          }
          (root / 'replit-candidate-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"result={receipt['result']}\n")
              fh.write(f"reason={receipt['reason']}\n")
              fh.write(f"exposed={','.join(exposed)}\n")
          PY

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo '### PIGA Replit Control Plane Candidate'
            echo '- Governance: A7SEM -> read-only probe -> evidence -> A7SEM Reverse'
            echo '- Authority: none'
            echo "- Result: ${{ steps.assess.outputs.result || 'UNKNOWN' }}"
            echo "- Reason: ${{ steps.assess.outputs.reason || 'receipt unavailable' }}"
            echo "- Exposed candidate endpoints: ${{ steps.assess.outputs.exposed || 'none' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: piga-replit-control-plane-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
