name: PIGA Replit Expo Origin Discovery

on:
  push:
    branches: [main]
    paths: ['.github/workflows/replit-expo-origin-discovery.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch Expo manifest and declared Android launch asset read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          base='https://piga-executor-client.replit.app'

          curl --silent --show-error --location --max-redirs 3 --max-time 30 \
            -H 'Accept: application/expo+json,application/json' \
            -H 'Expo-Platform: android' \
            -D evidence/manifest.headers \
            -o evidence/manifest.body \
            -w '%{http_code}\n%{url_effective}\n%{content_type}\n' \
            "$base/" > evidence/manifest.meta || true

          python3 - <<'PY' > evidence/launch-url.txt
          import json
          from pathlib import Path
          data = json.loads(Path('evidence/manifest.body').read_text())
          candidates = []
          launch = data.get('launchAsset')
          if isinstance(launch, dict) and isinstance(launch.get('url'), str):
              candidates.append(launch['url'])
          assets = data.get('assets')
          if isinstance(assets, list):
              for asset in assets:
                  if isinstance(asset, dict) and isinstance(asset.get('url'), str) and 'bundle' in asset['url']:
                      candidates.append(asset['url'])
          if not candidates:
              raise SystemExit('No Expo launch asset URL found')
          print(candidates[0])
          PY

          launch_url=$(cat evidence/launch-url.txt)
          case "$launch_url" in
            https://piga-executor-client.replit.app/*) ;;
            *) echo 'Launch asset escaped admitted Replit origin' >&2; exit 2 ;;
          esac
          curl --silent --show-error --location --max-redirs 3 --max-time 60 \
            -D evidence/launch-asset.headers \
            -o evidence/launch-asset.body \
            -w '%{http_code}\n%{url_effective}\n%{content_type}\n%{size_download}\n' \
            "$launch_url" > evidence/launch-asset.meta || true

      - name: Extract bounded public endpoint evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          root = Path('evidence')
          texts = []
          for name in ('manifest.body', 'launch-asset.body'):
              p = root / name
              if p.exists() and p.stat().st_size <= 80_000_000:
                  texts.append((name, p.read_text(errors='replace')))

          url_re = re.compile(r'https?://[^\s"\'<>\\)]+')
          findings = []
          seen = set()
          endpoint_keywords = ('api', 'pair', 'bridge', 'piga', 'replit', 'vercel', 'health', 'origin')
          snippet_keywords = re.compile(r'EXPO_PUBLIC_[A-Z0-9_]*(?:API|ORIGIN|PAIR|BRIDGE)[A-Z0-9_]*|API_ORIGIN|API_URL|PAIRING|BRIDGE', re.I)

          for source, text in texts:
              for url in url_re.findall(text):
                  clean = url.rstrip(';,]}')
                  if any(k in clean.lower() for k in endpoint_keywords):
                      key = ('url', clean)
                      if key not in seen:
                          seen.add(key)
                          findings.append({'source': source, 'url': clean[:1200]})
              for match in snippet_keywords.finditer(text):
                  start = max(0, match.start() - 220)
                  end = min(len(text), match.end() + 420)
                  snippet = re.sub(r'\s+', ' ', text[start:end])[:900]
                  key = ('snippet', snippet)
                  if key not in seen:
                      seen.add(key)
                      findings.append({'source': source, 'snippet': snippet})
                  if len(findings) >= 150:
                      break

          receipt = {
              'schema': 'piga.replit-expo-origin-discovery.v2',
              'authority': 'none',
              'governance': 'A7SEM -> read-only public Expo manifest/launch asset -> evidence -> A7SEM Reverse',
              'nonBudget': True,
              'manifestMeta': (root / 'manifest.meta').read_text(errors='replace') if (root / 'manifest.meta').exists() else None,
              'launchUrl': (root / 'launch-url.txt').read_text(errors='replace').strip() if (root / 'launch-url.txt').exists() else None,
              'launchAssetMeta': (root / 'launch-asset.meta').read_text(errors='replace') if (root / 'launch-asset.meta').exists() else None,
              'findings': findings[:150],
          }
          (root / 'origin-discovery.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2)[:50000])
          PY

      - name: Upload evidence receipt only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: piga-replit-expo-origin-discovery-${{ github.run_id }}
          path: evidence/origin-discovery.json
          retention-days: 7
