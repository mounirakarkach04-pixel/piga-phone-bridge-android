name: PIGA Runner Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/piga-runner-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm hosted runner assignment
        run: |
          echo "PIGA_RUNNER_PROBE=OK"
          uname -a
