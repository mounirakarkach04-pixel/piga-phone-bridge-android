name: Live PIGA Pocket Probe

on:
  push:
    branches:
      - ops/live-pigapocket-probe-20260827-1008

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe canonical production surface and pairing contract
        shell: bash
        run: |
          set -u
          probe_get() {
            label="$1"
            url="$2"
            out="$(mktemp)"
            code="$(curl -sS -L --max-time 20 -o "$out" -w '%{http_code}' "$url" || true)"
            echo "=== $label ==="
            echo "HTTP $code"
            head -c 2000 "$out" || true
            echo
            rm -f "$out"
          }
          probe_post() {
            label="$1"
            url="$2"
            out="$(mktemp)"
            code="$(curl -sS -L --max-time 20 -H 'content-type: application/json' -d '{}' -o "$out" -w '%{http_code}' "$url" || true)"
            echo "=== $label ==="
            echo "HTTP $code"
            head -c 2000 "$out" || true
            echo
            rm -f "$out"
          }

          probe_get "ROOT" "https://pigapocket.com/"
          probe_get "HEALTHZ" "https://pigapocket.com/healthz"
          probe_get "API_HEALTH" "https://pigapocket.com/api/health"
          probe_get "DEVICE_PAIRING" "https://pigapocket.com/device-pairing"
          probe_post "PAIR_CHALLENGE_INVALID" "https://pigapocket.com/api/bridge/pairing/challenge"
          probe_post "PAIR_CONFIRM_INVALID" "https://pigapocket.com/api/bridge/pairing/confirm"
