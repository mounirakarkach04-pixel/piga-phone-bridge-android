name: Replit Origin Probe

on:
  push:
    branches:
      - ops/replit-origin-probe-20260827

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CANDIDATE_ORIGIN: https://piga-executor-client.replit.app
    steps:
      - name: Probe public Enterprise fingerprints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe-report

          probe_get() {
            local name="$1"
            local url="$2"
            set +e
            local status
            status=$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 25 \
              --dump-header "probe-report/${name}.headers" \
              --output "probe-report/${name}.body" \
              --write-out '%{http_code}' \
              "$url")
            local rc=$?
            set -e
            printf '%s\n' "$status" > "probe-report/${name}.status"
            printf '%s\n' "$rc" > "probe-report/${name}.curl_rc"
          }

          probe_post_json() {
            local name="$1"
            local url="$2"
            local body="$3"
            set +e
            local status
            status=$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 25 \
              --header 'Content-Type: application/json' \
              --request POST --data "$body" \
              --dump-header "probe-report/${name}.headers" \
              --output "probe-report/${name}.body" \
              --write-out '%{http_code}' \
              "$url")
            local rc=$?
            set -e
            printf '%s\n' "$status" > "probe-report/${name}.status"
            printf '%s\n' "$rc" > "probe-report/${name}.curl_rc"
          }

          probe_get root "$CANDIDATE_ORIGIN/"
          probe_get healthz "$CANDIDATE_ORIGIN/api/healthz"
          # Deliberately invalid inputs: exercise route identity without creating a pairing ceremony.
          probe_post_json pairing_invalid "$CANDIDATE_ORIGIN/api/bridge/pairing/challenge" '{}'
          probe_post_json pairing_schema "$CANDIDATE_ORIGIN/api/bridge/pairing/challenge" '{"deviceId":"x","publicKey":"x","capabilities":{}}'
          probe_post_json confirm_invalid "$CANDIDATE_ORIGIN/api/bridge/pairing/confirm" '{}'

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('probe-report')

          def read(name, suffix):
              path = root / f'{name}.{suffix}'
              return path.read_text(errors='replace').strip() if path.exists() else ''

          def parse_json(text):
              try:
                  return json.loads(text)
              except Exception:
                  return None

          health_status = read('healthz', 'status')
          health = parse_json(read('healthz', 'body'))
          challenge_status = read('pairing_invalid', 'status')
          challenge = parse_json(read('pairing_invalid', 'body'))
          schema_status = read('pairing_schema', 'status')
          schema = parse_json(read('pairing_schema', 'body'))
          confirm_status = read('confirm_invalid', 'status')
          confirm = parse_json(read('confirm_invalid', 'body'))

          enterprise_fingerprint = bool(
              health_status == '200'
              and isinstance(health, dict)
              and health.get('status') == 'ok'
              and challenge_status == '400'
              and isinstance(challenge, dict)
              and challenge.get('error') == 'A valid EC-P256 device identity is required.'
          )

          report = {
              'candidateOrigin': os.environ['CANDIDATE_ORIGIN'],
              'root': {
                  'httpStatus': read('root', 'status'),
                  'curlExitCode': read('root', 'curl_rc'),
                  'contentType': next((line.split(':', 1)[1].strip() for line in read('root', 'headers').splitlines() if line.lower().startswith('content-type:')), None),
              },
              'healthz': {
                  'httpStatus': health_status,
                  'curlExitCode': read('healthz', 'curl_rc'),
                  'json': health,
              },
              'invalidPairingChallenge': {
                  'httpStatus': challenge_status,
                  'curlExitCode': read('pairing_invalid', 'curl_rc'),
                  'json': challenge,
              },
              'legacySchemaProbe': {
                  'httpStatus': schema_status,
                  'curlExitCode': read('pairing_schema', 'curl_rc'),
                  'json': schema,
              },
              'invalidPairingConfirm': {
                  'httpStatus': confirm_status,
                  'curlExitCode': read('confirm_invalid', 'curl_rc'),
                  'json': confirm,
              },
              'enterpriseApiFingerprint': enterprise_fingerprint,
              'authorityGranted': False,
              'note': 'Diagnostic only. Every pairing probe is intentionally invalid before persistence and no production binding was changed.',
          }
          (root / 'report.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: replit-origin-probe
          path: probe-report/
          if-no-files-found: error
          retention-days: 7
