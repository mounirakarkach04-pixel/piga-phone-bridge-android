name: PIGA Supabase Control Plane Probe

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/supabase-control-plane-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Supabase v4 and production cutover
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://qjvopzschqukitvudgfz.supabase.co/functions/v1/piga-control-plane'
          APP='https://app.pigapocket.com'
          PUBLIC='https://pigapocket.com'
          mkdir -p evidence

          probe_health() {
            local name="$1"
            local url="$2"
            curl -sS --retry 3 --retry-delay 3 --max-time 20 -D "evidence/${name}.headers" -o "evidence/${name}.json" -w '%{http_code}' "$url" > "evidence/${name}.status"
            test "$(cat "evidence/${name}.status")" = '200'
            jq -e '.schema=="piga.control-plane-health.v1" and .status=="HEARTBEAT" and .authority=="none" and .engineCount==5 and .additionalEngineCreated==false and .a7semReverseIsEngine==false and .heartbeatFresh==true and .heartbeatTtlMs==60000 and .specVersion=="piga-supabase-control-plane-v4" and .persistence=="supabase-postgres" and .admission=="fail-closed" and .bridgeCrypto.device=="EC-P256-SHA256" and .bridgeCrypto.server=="Ed25519" and .bridgeCrypto.durable==true and (.clerkIssuers|index("clerk.app.pigapocket.com")!=null)' "evidence/${name}.json"
          }

          probe_health direct "$BASE/api/health"
          probe_health app "$APP/api/health"
          probe_health public "$PUBLIC/api/health"

          DIRECT_KEY="$(jq -r '.bridgeCrypto.serverKeyId' evidence/direct.json)"
          APP_KEY="$(jq -r '.bridgeCrypto.serverKeyId' evidence/app.json)"
          PUBLIC_KEY="$(jq -r '.bridgeCrypto.serverKeyId' evidence/public.json)"
          test -n "$DIRECT_KEY"
          test "$DIRECT_KEY" = "$APP_KEY"
          test "$DIRECT_KEY" = "$PUBLIC_KEY"

          curl -sS --max-time 20 -D evidence/first-owner.headers -o evidence/first-owner.json -w '%{http_code}' "$APP/api/governance/first-owner/bootstrap" > evidence/first-owner.status
          test "$(cat evidence/first-owner.status)" = '401'
          jq -e '.error=="Authentication required."' evidence/first-owner.json

          curl -sS --max-time 20 -X POST -H 'content-type: application/json' -d '{}' -D evidence/challenge.headers -o evidence/challenge.json -w '%{http_code}' "$APP/api/bridge/pairing/challenge" > evidence/challenge.status
          test "$(cat evidence/challenge.status)" = '400'
          jq -e '.error=="A valid EC-P256 device identity is required."' evidence/challenge.json

          curl -sS --max-time 20 -X POST -H 'content-type: application/json' -d '{}' -D evidence/watchdog.headers -o evidence/watchdog.json -w '%{http_code}' "$PUBLIC/api/factory/trigger/next" > evidence/watchdog.status
          case "$(cat evidence/watchdog.status)" in
            401|503) ;;
            *) echo 'Unsigned watchdog was not fail-closed'; cat evidence/watchdog.json; exit 1 ;;
          esac

          curl -fsS --max-time 20 "$PUBLIC/" > evidence/showroom.html
          grep -qi 'piga' evidence/showroom.html

          jq -n --arg key "$DIRECT_KEY" '{sequence:"A7SEM -> Supabase v4 -> Cloudflare production -> external evidence -> A7SEM Reverse",result:"PASS",reason:"SUPABASE_V4_PRODUCTION_CUTOVER_EXTERNALLY_PROVEN",authority:"none",serverKeyId:$key}' > evidence/a7sem-receipt.json

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: piga-supabase-control-plane-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
