name: PIGA Pocket Enterprise Shell APK

on:
  push:
    branches: ["factory/pocket-enterprise-shell-public-runner-20260903"]
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/pocket-bootstrap-apk.yml"
      - "pocket-bootstrap/**"
      - "settings.gradle.kts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-enterprise-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Build enterprise shell APK
        run: gradle :pocket-bootstrap:assembleDebug --build-cache --stacktrace
      - name: Record evidence
        shell: bash
        run: |
          set -euo pipefail
          APK=pocket-bootstrap/build/outputs/apk/debug/pocket-bootstrap-debug.apk
          test -s "$APK"
          sha256sum "$APK" > "$APK.sha256"
          mkdir -p pocket-bootstrap-evidence
          printf '{"schema":"piga.pocket-enterprise-shell.v1","commit":"%s","package":"com.pigapocket.enterprise","targetOrigin":"https://app.pigapocket.com","privateEnterpriseSourceIncluded":false,"voicePermission":"origin-bound","publicationAuthorized":false,"completionClaim":"ENTERPRISE_WEB_SHELL_APK_BUILD_ONLY"}\n' "$GITHUB_SHA" > pocket-bootstrap-evidence/bootstrap.json
      - uses: actions/upload-artifact@v4
        with:
          name: piga-pocket-enterprise-shell-${{ github.sha }}
          path: |
            pocket-bootstrap/build/outputs/apk/debug/pocket-bootstrap-debug.apk
            pocket-bootstrap/build/outputs/apk/debug/pocket-bootstrap-debug.apk.sha256
            pocket-bootstrap-evidence/bootstrap.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish bounded prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/factory/pocket-enterprise-shell-public-runner-20260903'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK=pocket-bootstrap/build/outputs/apk/debug/pocket-bootstrap-debug.apk
          SHA_FILE="$APK.sha256"
          EVIDENCE=pocket-bootstrap-evidence/bootstrap.json
          SHORT_SHA="${GITHUB_SHA:0:12}"
          TAG="piga-pocket-shell-${SHORT_SHA}"
          cp "$APK" piga-pocket-enterprise-shell.apk
          cp "$SHA_FILE" piga-pocket-enterprise-shell.apk.sha256
          cp "$EVIDENCE" piga-pocket-enterprise-shell-evidence.json
          gh release create "$TAG" \
            piga-pocket-enterprise-shell.apk \
            piga-pocket-enterprise-shell.apk.sha256 \
            piga-pocket-enterprise-shell-evidence.json \
            --target "$GITHUB_SHA" \
            --title "PIGA Pocket Enterprise Shell ${SHORT_SHA}" \
            --notes "Internal preview shell only. Package: com.pigapocket.enterprise. Target: https://app.pigapocket.com. Production authorization remains blocked pending physical E2E, A7SEM Reverse, and Final Release Control." \
            --prerelease
