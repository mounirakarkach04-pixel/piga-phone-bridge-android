name: AEIOU Android RC APK

on:
  push:
    branches:
      - "factory/aeiou-shell-public-runner-20260903"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aeiou-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify canonical AEIOU web RC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pocket-bootstrap-evidence
          python - <<'PY'
          import hashlib, json, urllib.request
          origin='https://qjvopzschqukitvudgfz.supabase.co/functions/v1/aeiou-kids-app/'
          health=origin+'health'
          headers={'User-Agent':'AEIOU-Android-RC-Builder/1.0','Accept-Encoding':'identity'}
          with urllib.request.urlopen(urllib.request.Request(health,headers=headers),timeout=20) as r:
              status=r.status
              body=r.read().decode('utf-8','strict')
          if status != 200:
              raise SystemExit(f'health HTTP {status}')
          data=json.loads(body)
          if data.get('status')!='PASS' or data.get('app')!='AEIOU':
              raise SystemExit(f'fail-closed health payload: {data}')
          with urllib.request.urlopen(urllib.request.Request(origin,headers=headers),timeout=25) as r:
              html=r.read().decode('utf-8','strict')
          required=['AEIOU','Noor Stories','Amina','Singmodus']
          missing=[x for x in required if x not in html]
          if missing:
              raise SystemExit(f'missing runtime markers: {missing}')
          evidence={'schema':'aeiou.android-shell-preflight.v1','origin':origin,'health':data,'htmlSha256':hashlib.sha256(html.encode()).hexdigest(),'requiredMarkers':required,'missing':missing,'authority':'build-evidence-only'}
          with open('pocket-bootstrap-evidence/runtime-preflight.json','w',encoding='utf-8') as f:
              json.dump(evidence,f,separators=(',',':'));f.write('\n')
          print('AEIOU_WEB_RC_PASS',data.get('build'))
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Build AEIOU Android RC APK
        run: gradle :pocket-bootstrap:assembleDebug --build-cache --stacktrace
      - name: Record governed build evidence
        shell: bash
        run: |
          set -euo pipefail
          APK=pocket-bootstrap/build/outputs/apk/debug/pocket-bootstrap-debug.apk
          test -s "$APK"
          sha256sum "$APK" > "$APK.sha256"
          printf '{"schema":"aeiou.android-shell.v1","commit":"%s","package":"com.pigapocket.aeiou","versionCode":10001,"versionName":"1.0.0-rc1","targetOrigin":"https://qjvopzschqukitvudgfz.supabase.co/functions/v1/aeiou-kids-app/","nativeTtsBridge":true,"nativeSpeechRecognitionBridge":true,"webAudioSingMode":true,"privateEnterpriseSourceIncluded":false,"productionPublicationAuthorized":false,"completionClaim":"ANDROID_RC_APK_BUILD_EVIDENCE_ONLY"}\n' "$GITHUB_SHA" > pocket-bootstrap-evidence/bootstrap.json
      - uses: actions/upload-artifact@v4
        with:
          name: aeiou-android-rc1-${{ github.sha }}
          path: |
            pocket-bootstrap/build/outputs/apk/debug/pocket-bootstrap-debug.apk
            pocket-bootstrap/build/outputs/apk/debug/pocket-bootstrap-debug.apk.sha256
            pocket-bootstrap-evidence/bootstrap.json
            pocket-bootstrap-evidence/runtime-preflight.json
          if-no-files-found: error
          retention-days: 30
