name: PIGA Pocket Enterprise Web Shell APK

on:
  push:
    branches: ["factory/pocket-enterprise-webshell-20260903"]
  pull_request:
    branches: ["main"]
    paths:
      - "pocket-bootstrap/**"
      - ".github/workflows/pocket-bootstrap-apk.yml"
      - "settings.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-enterprise-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Build PIGA Pocket Enterprise Web Shell APK
        run: gradle :pocket-bootstrap:assembleDebug --build-cache --stacktrace
      - name: Record governed evidence
        shell: bash
        run: |
          set -euo pipefail
          APK=pocket-bootstrap/build/outputs/apk/debug/pocket-bootstrap-debug.apk
          test -s "$APK"
          sha256sum "$APK" > "$APK.sha256"
          mkdir -p pocket-bootstrap-evidence
          printf '{"schema":"piga.pocket-enterprise-webshell.v1","commit":"%s","package":"com.pigapocket.enterprise","targetOrigin":"https://app.pigapocket.com","privateEnterpriseSourceIncluded":false,"artifactClass":"ANDROID_WEB_SHELL_INTERNAL_PREVIEW","publicationAuthorized":false,"physicalE2EPassed":false,"finalReleaseControl":"BLOCKED_PENDING_PHYSICAL_E2E"}\n' "$GITHUB_SHA" > pocket-bootstrap-evidence/bootstrap.json
      - uses: actions/upload-artifact@v4
        with:
          name: piga-pocket-enterprise-webshell-${{ github.sha }}
          path: |
            pocket-bootstrap/build/outputs/apk/debug/pocket-bootstrap-debug.apk
            pocket-bootstrap/build/outputs/apk/debug/pocket-bootstrap-debug.apk.sha256
            pocket-bootstrap-evidence/bootstrap.json
          if-no-files-found: error
          retention-days: 30
