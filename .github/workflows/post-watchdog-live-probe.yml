name: PIGA Post-Watchdog Live Probe

on:
  push:
    branches:
      - ops/post-watchdog-live-probe-20260827-1206

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe pigapocket production
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local method="$1"
            local url="$2"
            local data="${3:-}"
            local body
            body="$(mktemp)"
            if [ "$method" = "GET" ]; then
              code="$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' "$url")"
            else
              code="$(curl --silent --show-error --max-time 20 -X "$method" -H 'content-type: application/json' --data "$data" -o "$body" -w '%{http_code}' "$url")"
            fi
            echo "=== $method $url ==="
            echo "HTTP $code"
            cat "$body"
            echo
            rm -f "$body"
          }
          probe GET https://pigapocket.com/
          probe GET https://pigapocket.com/healthz
          probe GET https://pigapocket.com/api/health
          probe GET https://pigapocket.com/device-pairing
          probe POST https://pigapocket.com/api/bridge/pairing/challenge '{}'
          probe POST https://pigapocket.com/api/bridge/pairing/confirm '{}'
