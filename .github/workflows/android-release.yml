name: Android Release Candidate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify PIGA synchronization gate
        run: python scripts/check_piga_sync.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Test, lint and build release outputs
        run: |
          gradle \
            :app:testReleaseUnitTest \
            :app:lintRelease \
            :app:assembleRelease \
            :app:bundleRelease \
            --build-cache \
            --parallel \
            --stacktrace

      - name: Prepare release package
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          UNSIGNED_AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$UNSIGNED_APK"
          test -f "$UNSIGNED_AAB"

          mkdir -p release
          SIGNED=false

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && \
             [ -n "${ANDROID_KEY_ALIAS:-}" ] && \
             [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release/piga-release.keystore
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            test -x "$APKSIGNER"

            "$APKSIGNER" sign \
              --ks release/piga-release.keystore \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              --out "release/piga-pocket-enterprise-${VERSION_NAME}.apk" \
              "$UNSIGNED_APK"
            "$APKSIGNER" verify --verbose --print-certs "release/piga-pocket-enterprise-${VERSION_NAME}.apk"

            jarsigner \
              -keystore release/piga-release.keystore \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" \
              -signedjar "release/piga-pocket-enterprise-${VERSION_NAME}.aab" \
              "$UNSIGNED_AAB" \
              "$ANDROID_KEY_ALIAS"
            jarsigner -verify -verbose -certs "release/piga-pocket-enterprise-${VERSION_NAME}.aab"
            rm -f release/piga-release.keystore
            SIGNED=true
          else
            cp "$UNSIGNED_APK" "release/piga-pocket-enterprise-${VERSION_NAME}-unsigned.apk"
            cp "$UNSIGNED_AAB" "release/piga-pocket-enterprise-${VERSION_NAME}-unsigned.aab"
            echo "Signing secrets not present; produced clearly marked unsigned release candidates."
          fi

          sha256sum release/* > release/SHA256SUMS.txt
          python - <<PY
          import json
          from pathlib import Path
          manifest = {
              "schema": "piga.android-release-candidate.v1",
              "versionName": "$VERSION_NAME",
              "versionCode": int("$VERSION_CODE"),
              "gitSha": "${GITHUB_SHA}",
              "signed": "$SIGNED" == "true",
              "controlPlane": "https://pigapocket.com",
              "engineCount": 5,
              "additionalEngineCreated": False,
              "files": sorted(p.name for p in Path("release").iterdir() if p.is_file()),
          }
          Path("release/release-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          sha256sum release/release-manifest.json >> release/SHA256SUMS.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: piga-pocket-enterprise-android-release-candidate
          path: release/
          if-no-files-found: error
          retention-days: 30
